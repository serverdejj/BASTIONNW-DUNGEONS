# Copia o fusiona estas secciones con tu config.yml ACTUAL (no borres otras opciones).
mob-hologram:
  enabled: true
  height: 0.50
  line-spacing: 0.30
  scale: 1.0
  offset-x: 0.0
  offset-y: 0.0
  offset-z: 0.0
  background-opacity: 0
  shadow: true
  see-through: false
  lines:
    - '{name} &7| &c❤ {health}/{max_health}'

