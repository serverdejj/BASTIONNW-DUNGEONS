name: BastionDungeons
version: 1.2.22-dev
main: com.bastionmc.dungeons.BastionDungeons
api-version: '1.21.11'
author: BASTION MC
description: Mazmorras en mundos permanentes con MythicMobs
softdepend: [MythicMobs]
commands:
  dungeon:
    description: Parties, mundos, mazmorras y loot
    usage: /dungeon worlds | setspawn | setmobspawn | clearmobspawns | go | leave | party | loot
    aliases: [dungeons]
permissions:
  bastiondungeons.use:
    default: true
  bastiondungeons.bypass:
    default: op
