name: BastionDungeons
version: 1.2.50-bedrock-test
main: com.bastionmc.dungeons.BastionDungeons
api-version: '1.21.11'
author: BASTION MC
description: Partidas privadas y mazmorras schematic (prototipo)
depend: [WorldEdit]
softdepend: [MythicMobs, LibsDisguises, ModelEngine, floodgate]
commands:
  dungeon:
    description: Comandos de party y mazmorra
    usage: /dungeon reload (OP) | /dungeon radio 15 oleadas 2 (OP) | /dungeon mobs radio <radio> | /dungeon boss bloque | /dungeon boss spawn | /dungeon romper | libre (OP); /dungeon map <nombre> <facil|normal|dificil> (OP); /dungeon go map <nombre> [dificultad] (OP); /dungeon party add <jugador> | accept | leave | list; /dungeon go; /dungeon leave; /dungeon setspawn; /dungeon setspawn parkour; /dungeon setmobspawn; /dungeon clearmobspawns; /dungeon loot add <enemigo> <probabilidad> | list <enemigo> | remove <enemigo> <id>
    aliases: [dungeons]
permissions:
  bastiondungeons.use:
    default: true

  bastiondungeons.bypass:
    description: Ignora los horarios de apertura de mazmorras
    default: op
