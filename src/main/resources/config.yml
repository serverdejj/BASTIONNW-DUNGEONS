    power: 'Poder'
    punch: 'Retroceso'
    flame: 'Fuego'
    infinity: 'Infinidad'
    protection: 'Protección'
    fire_protection: 'Protección contra el fuego'
    feather_falling: 'Caída de pluma'
    blast_protection: 'Protección contra explosiones'
    projectile_protection: 'Protección contra proyectiles'
