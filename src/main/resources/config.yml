# ItemStacker 1.1.0 guarda la cantidad agrupada en un contador virtual.
# Se lee directamente cuando el plugin está instalado; sin ItemStacker se usa Minecraft.
itemstacker:
  enabled: true

# Porcentaje de durabilidad solo para piezas equipables en ranuras de armadura.
durability-display:
  enabled: true
  format: '&7Durabilidad: %color%%percent%%'
  thresholds:
    high: 75
    low: 25
  colors:
    high: '&a'
    medium: '&e'
    low: '&c'

# Símbolos editables SIN paquete de recursos.
# No son la textura exacta de la barra de armadura de Minecraft.
armor-display:
  enabled: false
  prefix: '&7Armadura: '
  show-icons: true
  show-empty-icons: false
  show-armor-points: true
  max-icons: 10
  icons:
    full: '■'
    half: '◧'
    empty: '□'
  colors:
    full: '&7'
    half: '&7'
    empty: '&8'
  # Valores para armaduras especiales si necesitas ajustar su defensa.
  material-overrides: {}
attributes:
  names:
    attack_damage: 'Daño de ataque'
    attack_speed: 'Velocidad de ataque'
    armor_toughness: 'Dureza de armadura'
    knockback_resistance: 'Resistencia al empuje'
