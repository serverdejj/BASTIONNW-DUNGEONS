# BASTION DUNGEONS 1.2.22: mundos permanentes en plugins/BastionDungeons/worlds/
# Los spawns se guardan mediante comandos en spawns.yml y mobspawns.yml.

# Votación de dificultad (todos votan; empates al azar).
difficulty:
  easy:
    health-multiplier: 0.5
    damage-multiplier: 0.5
  normal:
    health-multiplier: 1.0
    damage-multiplier: 1.0
  hard:
    health-multiplier: 2.0
    damage-multiplier: 2.0

# Cada intervalo se mueve el enemigo más lejano de su jugador más cercano.
enemy-stalking:
  enabled: true
  interval-seconds: 10
  include-bosses: true
  distance-behind-player: 2.0

difficulty-voting:
  vote-duration-seconds: 20
  result-seconds: 5
  require-vote-before-close: true

dungeon-protection:
  block-interactions: true
  block-breaking: true
  block-placing: true
  block-ender-pearls: true

mob-drops:
  custom-loot-only: true

height-protection:
  enabled: true
  max-height-above-spawn: 10

# Solo los mundos de instancia bd_* creados por BastionDungeons.
# MythicMobs invocados por el plugin se permiten con SpawnReason.CUSTOM.
dungeon-mobs:
  block-natural-spawns: true
  # false: solo invocaciones hechas por BastionDungeons mediante MythicMobs.
  allow-other-custom-spawns: false

# Reglas por mapa (tambien se aplican si la seleccion fue aleatoria).
# Usa el nombre EXACTO del archivo .schem, sin extension, en minusculas.
# Los mapas no incluidos siguen usando el radio normal de 33 bloques.
map-rules:
  defaults:
    radius-blocks: 33
  maps:
    netherybreis:
      radius-blocks: 67
      below-spawn:
        enabled: true
        blocks: 20
        damage: 1000.0
        force-death-if-survives: true

# dungeon1-endlessxl: modo de avance sin oleadas. Los otros mapas siguen igual.
# Las zonas y el spawn del jefe se guardan por mapa en adventure.yml con comandos OP.
adventure:
  enabled: true
  map: 'dungeon1-endlessxl'
  travel-radius-blocks: 256
  encounter-boundary-blocks: 15
  mobs-per-player: 4
  encounter:
    # Al activarse una emboscada, reune al equipo alrededor del centro de la zona.
    teleport-party-on-start: true
    # Revision cada segundo; si un mob sale de los 15 bloques, volvera en ~1-2 s.
    mob-return-delay-ticks: 20
    # Velocidad base aproximada (en MythicMobs pueden existir modificadores).
    skeletal-knight-speed: 0.32
    mobs-per-player: 4
    waves: 2
    next-wave-delay-seconds: 0
  leaves:
    prevent-decay: true
  parkour:
    enabled: true
    water-detection-radius-blocks: 40
    freeze-seconds: 5
  mob-ids:
    - 'SkeletalMinion'
    - 'SkeletalKnight'
  boss-id: 'SkeletonKing'
  boss-health: 500.0
  boss-radius-blocks: 100


# THE LABYRINTH: aventura de Slimes, separada de EndlessXL.
# La dificultad solo multiplica VIDA y DANO (facil 0.5x / normal 1x / dificil 2x).
# La altura (height-blocks) y la velocidad NO cambian segun la dificultad.
# Los mythic-id deben existir en plugins/MythicMobs/Mobs/ (ver plantilla adjunta).
labyrinth:
  # Referencia del modelo de jugador usado por LibsDisguises (1.8 bloques).
  # Para alturas uniformes, usa los mobs Type: ZOMBIE de la plantilla actualizada.
  player-model-reference-height: 1.8
  enabled: true
  map: 'the-labyrinth' # tambien acepta schematic the_labyrinth.schem
  encounter-boundary-blocks: 15
  encounter:
    teleport-party-on-start: true
    # /dungeon radio 15 oleadas 2 = 1 inicial + 2 adicionales (3 totales).
    default-extra-waves: 2
    wave-counts: [5, 10, 15]
    next-wave-delay-seconds: 3
    mob-return-delay-ticks: 20
  mobs:
    mutant:
      mythic-id: BastionSlimeMutant
      display-name: '&#6BFF80&lMutante Slime'
      name-format: '&aMutante Slime'
      health: 100.0
      damage: 9.0
      height-blocks: 0.75
      speed-multiplier: 1.67
      weight: 3.0
    giant:
      mythic-id: BastionSlimeGiant
      display-name: '&#56D985&lSlime Gigante'
      name-format: '&aSlime Gigante'
      health: 250.0
      damage: 16.0
      height-blocks: 1.5
      speed-multiplier: 0.8
      weight: 1.0
    moon:
      mythic-id: BastionSlimeMoon
      display-name: '&#BFA1FF&lSlime Moon'
      name-format: '&aSlime Moon'
      health: 160.0
      damage: 13.0
      height-blocks: 0.9
      speed-multiplier: 0.5
      spawn-chance-percent: 1.0
      # Configura el loot legendario con /dungeon loot add BastionSlimeMoon <chance>
    king:
      mythic-id: BastionSlimeKing
      display-name: '&#44FF77&lRey Slime'
      name-format: '&aRey Slime'
      health: 2000.0
      damage: 35.0
      height-blocks: 3.0
      speed-multiplier: 0.5

# Ajustes individuales de los antiguos esqueletos de EndlessXL.
# NORMAL = valores base; FACIL aplica x0.5 y DIFICIL x2 a VIDA y DANO.
# "scale" y "speed" permanecen iguales con cualquier dificultad.
skeleton-mobs:
  minion:
    health: 50.0
    damage: 7.0
    scale: 1.0
    name-format: '&#FFFFFFEsqueleto &#C080F6&lMALDITO'
  knight:
    health: 125.0
    damage: 13.0
    scale: 1.0
    speed: 0.32
    name-format: '&#FFFFFFGuardián &#F6BE80&lESQUELETO'
  king:
    health: 500.0
    damage: 22.0
    scale: 3.0
    name-format: '&#FFFFFFRey &#FF0000&lESQUELETO'

# Nombre con vida actualizada; aplica a los Slimes y esqueletos dentro de dungeons.
# Nota: LibsDisguises puede ocultar el nombre nativo en disfraces de jugador.
mob-nameplate:
  format: '{name} &7| &c❤ {health}/{max_health}'

# Jefe SkeletonKing / SkeletolKing: efectos especiales sin romper bloques.
# Se aplican a los jefes invocados por Dungeons; no a mobs sueltos de Survival.
boss-effects:
  enabled: true
  # 3 = triple altura del mob base. En disfraces de jugador el tamaño visible
  # depende de la versión de LibsDisguises (puede ignorar la escala).
  scale: 3.0
  skin:
    enabled: true
    # Antes registra la skin con LibsDisguises; instrucciones en README.
    registered-name: 'BastionKingSkin'
  entrance:
    drop-blocks: 10
    impact-knockback-radius: 3.5
  launch:
    enabled: true
    horizontal: 1.1
    vertical: 0.8
    cooldown-ms: 2500
  teleport:
    enabled: true
    interval-ticks: 180
    chance: 0.40
    behind-distance: 3.5
